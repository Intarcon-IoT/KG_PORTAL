# Paquetes con compilación nativa permitida
allowBuilds:
  # Solo los arrastra db-migrate (túneles SSH que no usamos); funcionan sin compilar
  cpu-features: false
  ssh2: false

# Excepciones de `pnpm audit`: solo avisos sin versión parcheada y no alcanzables, con fecha de revisión
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm   # braces <=3.0.3 sin parche; solo vía nodemon>chokidar (dev) con globs propios. Revisar 2026-11.
