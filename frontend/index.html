<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/logo_icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal KEYTER Group</title>
    <!-- Indicador mientras se restaura la sesión; Vue lo sustituye al montar -->
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f6f7f9 }
      .boot span { width: 28px; height: 28px; border: 3px solid #e5e7eb; border-top-color: #111111; border-radius: 50%; animation: boot-spin .8s linear infinite }
      @keyframes boot-spin { to { transform: rotate(360deg) } }
    </style>
  </head>
  <body>
    <div id="app"><div class="boot" role="status" aria-label="Cargando"><span></span></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
